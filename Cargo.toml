[workspace]
members = ["crates/lwfm-win"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# `list::ListView`, `edit::EditEvent` and the like read best with their prefix.
module_name_repetitions = "allow"

[package]
name = "lwfm"
version = "0.1.0"
edition = "2024"

[dependencies]
lwfm-win = { path = "crates/lwfm-win" }
mlua = { version = "0.12", features = ["lua54", "vendored"] }

[build-dependencies]
embed-manifest = "1.5.1"

[lints]
workspace = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
