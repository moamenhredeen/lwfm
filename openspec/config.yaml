schema: spec-driven

context: |
  lwfm: a fast, minimal, keyboard-friendly file manager for Windows.
  Goal: faster than Explorer by skipping shell layers (shell namespace,
  shell extensions, cloud overlays); customizable through a text config
  instead of an options dialog.

  Tech stack:
  - Rust (edition 2024, nightly toolchain), Windows-only binary.
  - Raw Win32 via Microsoft's `windows` crate (minimal feature flags), used
    only inside the workspace crate `crates/lwfm-win`.
    No UI frameworks (no WinUI, egui, native-windows-gui, winsafe).
  - Common controls v6: virtual ListView (LVS_OWNERDATA), Edit, status bar.
  - Manifest embedded with `embed-manifest` (PerMonitorV2 DPI, longPathAware).
  - Planned: Lua 5.4 via `mlua` (vendored) as the only config and scripting
    language (config.lua, WezTerm style), coming in `config-and-scripting`.

  Architecture rules:
  - `lwfm-win` is the only crate that depends on `windows` or contains
    `unsafe`; the `lwfm` binary declares `#![forbid(unsafe_code)]`. The public
    API of `lwfm-win` exposes no `windows` types and no escape hatch (no raw
    handles, no generic send-message): a missing capability is added to the
    crate, shaped by what lwfm needs it for. Every `unsafe` block does one
    thing and carries a `// SAFETY:` comment (enforced by clippy).
  - Controls are used through use-case traits (`ListSource` for the list):
    the application answers questions about its data, the crate owns the
    notification and paint protocol. Window-level facts arrive as plain
    `WindowEvent`s through `Handler`.
  - Changes made through a control's own methods are not echoed back as
    notifications; only what the user did is reported (exception: an input
    losing the focus is always reported).
  - The UI thread never does disk or network IO; workers report back through
    a channel plus a `UiWaker` wake-up, tagged with a generation counter so
    stale results are dropped.
  - Every user action is a command in the registry (src/cmd/registry.rs).
    Keys, mouse, path bar, and later Lua and IPC only compile and run command
    strings; never add an action that bypasses the registry.
  - Keys are intercepted in the message loop and normalized to chords
    (AltGr-safe, logical keys, canonical text form like `ctrl+shift+f5`);
    lookup walks scopes input/list -> global.
  - App state lives on the UI thread in a few RefCell groups (src/app/),
    reached through closure-taking accessors; never hold a borrow across a
    call into the window or a control, because they call back into the
    application (the list asks for cell text while its row count is set).
  - Names stay UTF-16 from the file system to the display; paths are absolute
    and normalized, with \\?\ added only at file API calls.

  Performance budgets (release build, measured with LWFM_TRACE=1):
  - Cold start to first painted listing < 100 ms (1,000 local entries).
  - 10,000-entry listing painted < 50 ms after enumeration completes.
  - Lua must never run per entry over a whole directory.

  Roadmap after core-window-listing: file-operations (own copy engine on
  CopyFileExW, recycle-bin delete, rename, mkdir), config-and-scripting
  (Lua config, presets explorer/commander/vim, key sequences, hint bar,
  hot reload), dual-pane-layout. Dark mode, icons, thumbnails, shell context
  menu, drag and drop and tabs are deferred.

  Conventions:
  - Conventional commit prefixes (feat:, fix:, docs:, infra:).
  - `cargo clippy --all-targets -- -D warnings`, `cargo fmt` and `cargo test`
    must pass. Pure logic (parsing, sorting, paths, history, chords) gets unit
    tests; Win32 behavior is verified by driving the real window.
  - The developer uses a German (QWERTZ) keyboard layout.

rules:
  proposal:
    - Include a "Non-goals" section that names the later change each deferred item belongs to
  design:
    - State which thread every new piece of work runs on and how results reach the UI thread
    - Name any new crate dependency and why the `windows` crate alone is not enough
  specs:
    - Express performance expectations as measurable requirements with a scenario
  tasks:
    - Include a task that measures the performance budgets when a change touches startup, enumeration or listing

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
