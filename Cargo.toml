[package]
name = "lwfm"
version = "0.1.0"
edition = "2024"

[dependencies]
mlua = { version = "0.12", features = ["lua54", "vendored"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_System_Com", "Win32_Globalization", "Win32_System_Time", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug", "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_System_Console", "Win32_System_IO"] }

[build-dependencies]
embed-manifest = "1.5.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
